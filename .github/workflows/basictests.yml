name: lab9-basic-tests

on:
  push:
    branches: [ main, test ]

jobs:
  lab9-basic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x validate-data.sh

      - name: Run and verify output
        run: |
          OUTPUT=$(bash validate-data.sh "pearse mccarthy" "083112234")
          echo "Test 1 output: $OUTPUT"
          if [ "$OUTPUT" = "PASS" ]; then echo "Test 1 Passed!"; else echo "Test 1 Failed!"; exit 1; fi

          OUTPUT=$(bash validate-data.sh "pearse mccarthy" "0831122344")
          echo "Test 2 output: $OUTPUT"
          if [ "$OUTPUT" = "PASS" ]; then echo "Test 2 Passed!"; else echo "Test 2 Failed!"; exit 1; fi

          OUTPUT=$(bash validate-data.sh "pearset mccarthy" "083112234")
          echo "Test 3 output: $OUTPUT"
          if [ "$OUTPUT" = "FAIL" ]; then echo "Test 3 Passed!"; else echo "Test 3 Failed!"; exit 1; fi
